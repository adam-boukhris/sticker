<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<style>
			:root {
				--ink: #2a0f1e;
				--pink: #ffdedb;
				--blush: #fff5f3;
				--rose: #f2cfcb;
				--red: #e5264f;
				--yellow: #ffd93d;
				--purple: #6b2480;
				--cream: #fdecc8;
				--sh: 4px 4px 0 var(--ink);
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			html {
				scroll-behavior: smooth;
			}
			body {
				font-family: 'Plus Jakarta Sans', sans-serif;
				color: var(--ink);
				background: var(--blush);
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
			}
			.ar {
				font-family: 'Cairo', sans-serif;
				color: var(--purple);
				font-weight: 700;
			}
			.display {
				font-family: 'Syne', sans-serif;
				font-weight: 800;
				letter-spacing: -0.03em;
				line-height: 0.98;
			}
			.wrap {
				max-width: 1160px;
				margin: 0 auto;
				padding: 0 20px;
			}
			section {
				border-bottom: 3px solid var(--ink);
			}
			.pill {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				border: 2px solid var(--ink);
				border-radius: 99px;
				padding: 5px 14px;
				font-size: 12px;
				font-weight: 700;
				background: #fff;
			}
			.pill.y {
				background: var(--yellow);
			}
			.pill.r {
				background: var(--red);
				color: #fff;
			}
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				background: var(--red);
				color: var(--ink);
				border: 2.5px solid var(--ink);
				border-radius: 99px;
				padding: 10px 18px;
				font: 700 14px 'Plus Jakarta Sans';
				box-shadow: var(--sh);
				cursor: pointer;
				text-decoration: none;
				transition:
					transform 0.12s,
					box-shadow 0.12s;
			}
			.btn:hover {
				transform: translate(2px, 2px);
				box-shadow: 2px 2px 0 var(--ink);
			}
			.btn:focus-visible,
			input:focus-visible,
			select:focus-visible,
			textarea:focus-visible,
			summary:focus-visible,
			button:focus-visible {
				outline: 3px solid var(--purple);
				outline-offset: 2px;
			}
			.arrow {
				display: inline-grid;
				place-items: center;
				width: 26px;
				height: 18px;
				background: var(--yellow);
				border: 2px solid var(--ink);
				border-radius: 6px;
				font-size: 11px;
			}
			.card {
				background: var(--blush);
				border: 3px solid var(--ink);
				border-radius: 20px;
				box-shadow: 6px 6px 0 var(--ink);
			}
			@media (prefers-reduced-motion: reduce) {
				* {
					transition: none !important;
					scroll-behavior: auto !important;
				}
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
